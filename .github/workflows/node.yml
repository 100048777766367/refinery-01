name: Independent Refinery Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'

permissions:
  contents: write

jobs:
  run-refinery:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Refinery
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Vận hành Nhà Máy Tinh Chế Độc Lập
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      - name: Lưu vết xuất xưởng tinh chế vào Git
        run: |
          git config --global user.name "Refinery-Master-Bot"
          git config --global user.email "bot@refinery.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🏭 [Refinery q'] Tinh chế dữ liệu chuẩn bán dẫn & Khởi sinh hệ sinh thái mới #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Nhà máy tĩnh lặng, không có biến thiên mới."
          fi
