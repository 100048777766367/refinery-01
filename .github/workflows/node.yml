name: Vault-03 Apex Recombinant Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '10 */4 * * *'

permissions:
  contents: write

jobs:
  run-vault03:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC
      - name: Kéo mã nguồn Vault-03
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG MỚI NHẤT: SETUP-PYTHON V7 & PYTHON 3.14
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. VẬN HÀNH ĐỐC CÔNG F3 APEX TỰ PHÔI THAI
      - name: Vận hành Đại Hợp Thể Vault-03
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU VẾT THÀNH PHẨM VÀ BÁO CÁO GITHUB
      - name: Lưu vết toàn bộ thành phẩm F3 lên Git
        run: |
          git config --global user.name "Vault-03-Apex-Bot"
          git config --global user.email "bot@vault03.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "🧬 [Vault-03 F3] Tái tổ hợp Siêu XOR N^N & Tích lũy tinh hoa dòng họ #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Đại hợp thể tĩnh lặng, không có biến thiên mới."
          fi
